[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
solc_version = "0.8.24"

[profile.default.fuzz]
runs = 1000
max_test_rejects = 65536
seed = 0x1

[profile.default.invariant]
runs = 100
depth = 15
fail_on_revert = true

[profile.test]
fuzz = { runs = 1000 }
invariant = { runs = 100 }

[rpc_endpoints]
sepolia = "https://sepolia.infura.io/v3/${INFURA_KEY}"
arbitrum_sepolia = "https://arbitrum-sepolia.infura.io/v3/${INFURA_KEY}"
optimism_sepolia = "https://optimism-sepolia.infura.io/v3/${INFURA_KEY}"
base_sepolia = "https://base-sepolia.infura.io/v3/${INFURA_KEY}"
zksync_sepolia = "https://sepolia.era.zksync.dev"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
number_underscore = "thousands"
